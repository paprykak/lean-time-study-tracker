<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 429" width="440" height="429" role="img"><rect width="100%" height="100%" fill="#ffffff"/><text x="12" y="18" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#58626f" text-anchor="start">Czy przestawić maszynę po tym pomiarze</text><rect x="12" y="36" width="232" height="86" rx="6" fill="#f3f4f6" stroke="#1d2530"/><text x="22" y="83.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Punkt poza granicą kontrolną?</text><line x1="244" y1="79" x2="272" y2="79" stroke="#c2410c" stroke-width="2"/><path d="M267,74 L274,79 L267,84" fill="none" stroke="#c2410c" stroke-width="2"/><text x="259" y="70" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">tak</text><rect x="278" y="36" width="152" height="86" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><text x="286" y="58" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Zatrzymaj, sprawdź</text><text x="286" y="75" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">ostatnie sztuki,</text><text x="286" y="92" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">szukaj przyczyny i</text><text x="286" y="109" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">zapisz ją.</text><line x1="128" y1="124" x2="128" y2="146" stroke="#58626f" stroke-width="2"/><path d="M123,141 L128,148 L133,141" fill="none" stroke="#58626f" stroke-width="2"/><text x="136" y="140" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="start" font-weight="700">nie</text><rect x="12" y="152" width="232" height="86" rx="6" fill="#f3f4f6" stroke="#1d2530"/><text x="22" y="182.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Seria: 2 z 3 powyżej 2σ, 4 z</text><text x="22" y="199.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">5 powyżej 1σ albo 8 po jednej</text><text x="22" y="216.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">stronie średniej?</text><line x1="244" y1="195" x2="272" y2="195" stroke="#c2410c" stroke-width="2"/><path d="M267,190 L274,195 L267,200" fill="none" stroke="#c2410c" stroke-width="2"/><text x="259" y="186" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">tak</text><rect x="278" y="152" width="152" height="86" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><text x="286" y="174" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Proces się</text><text x="286" y="191" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">przesunął. Znajdź,</text><text x="286" y="208" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">co się zmieniło,</text><text x="286" y="225" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">potem koryguj.</text><line x1="128" y1="240" x2="128" y2="262" stroke="#58626f" stroke-width="2"/><path d="M123,257 L128,264 L133,257" fill="none" stroke="#58626f" stroke-width="2"/><text x="136" y="256" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="start" font-weight="700">nie</text><rect x="12" y="268" width="232" height="69" rx="6" fill="#f3f4f6" stroke="#1d2530"/><text x="22" y="298.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Znany dryf, np. zużycie</text><text x="22" y="315.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">narzędzia, z planem korekty?</text><line x1="244" y1="302.5" x2="272" y2="302.5" stroke="#c2410c" stroke-width="2"/><path d="M267,297.5 L274,302.5 L267,307.5" fill="none" stroke="#c2410c" stroke-width="2"/><text x="259" y="293.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">tak</text><rect x="278" y="268" width="152" height="69" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><text x="286" y="290" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Koryguj według</text><text x="286" y="307" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">planu, a nie po</text><text x="286" y="324" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">każdym pomiarze.</text><line x1="128" y1="339" x2="128" y2="361" stroke="#58626f" stroke-width="2"/><path d="M123,356 L128,363 L133,356" fill="none" stroke="#58626f" stroke-width="2"/><text x="136" y="355" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="start" font-weight="700">nie</text><rect x="12" y="367" width="416" height="52" rx="6" fill="#ffffff" stroke="#1d2530" stroke-width="2"/><text x="22" y="389" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start" font-weight="700">Nie ruszaj nastaw. To zmienność wspólna; zmniejszy ją</text><text x="22" y="406" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start" font-weight="700">tylko zmiana procesu.</text></svg>

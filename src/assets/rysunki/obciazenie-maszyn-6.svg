<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 413" width="440" height="413" role="img"><rect width="100%" height="100%" fill="#ffffff"/><text x="12" y="18" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#58626f" text-anchor="start">Czy dołożyć zlecenia na wąskie gardło (reguła redakcji na</text><text x="12" y="36" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#58626f" text-anchor="start">podstawie modelu kolejki)</text><rect x="12" y="54" width="232" height="52" rx="6" fill="#f3f4f6" stroke="#1d2530"/><text x="22" y="76" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Po dołożeniu obciążenie</text><text x="22" y="93" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">zostaje poniżej 80%?</text><line x1="244" y1="80" x2="272" y2="80" stroke="#c2410c" stroke-width="2"/><path d="M267,75 L274,80 L267,85" fill="none" stroke="#c2410c" stroke-width="2"/><text x="259" y="71" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">tak</text><rect x="278" y="54" width="152" height="52" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><text x="286" y="76" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Dokładaj. Kolejka</text><text x="286" y="93" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">rośnie wolno.</text><line x1="128" y1="108" x2="128" y2="130" stroke="#58626f" stroke-width="2"/><path d="M123,125 L128,132 L133,125" fill="none" stroke="#58626f" stroke-width="2"/><text x="136" y="124" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="start" font-weight="700">nie</text><rect x="12" y="136" width="232" height="86" rx="6" fill="#f3f4f6" stroke="#1d2530"/><text x="22" y="166.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Czasy obróbki i odstępy</text><text x="22" y="183.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">między zleceniami są równe (c</text><text x="22" y="200.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">poniżej 0,5)?</text><line x1="244" y1="179" x2="272" y2="179" stroke="#c2410c" stroke-width="2"/><path d="M267,174 L274,179 L267,184" fill="none" stroke="#c2410c" stroke-width="2"/><text x="259" y="170" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">tak</text><rect x="278" y="136" width="152" height="86" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><text x="286" y="158" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Możesz dojść do</text><text x="286" y="175" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">90%, ale mierz</text><text x="286" y="192" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">kolejkę co</text><text x="286" y="209" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">tydzień.</text><line x1="128" y1="224" x2="128" y2="246" stroke="#58626f" stroke-width="2"/><path d="M123,241 L128,248 L133,241" fill="none" stroke="#58626f" stroke-width="2"/><text x="136" y="240" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="start" font-weight="700">nie</text><rect x="12" y="252" width="232" height="69" rx="6" fill="#f3f4f6" stroke="#1d2530"/><text x="22" y="274" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Da się w tym miesiącu skrócić</text><text x="22" y="291" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">przezbrojenia albo wyrównać</text><text x="22" y="308" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">napływ zleceń?</text><line x1="244" y1="286.5" x2="272" y2="286.5" stroke="#c2410c" stroke-width="2"/><path d="M267,281.5 L274,286.5 L267,291.5" fill="none" stroke="#c2410c" stroke-width="2"/><text x="259" y="277.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">tak</text><rect x="278" y="252" width="152" height="69" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><text x="286" y="274" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Najpierw zmniejsz</text><text x="286" y="291" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">zmienność, potem</text><text x="286" y="308" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">dokładaj.</text><line x1="128" y1="323" x2="128" y2="345" stroke="#58626f" stroke-width="2"/><path d="M123,340 L128,347 L133,340" fill="none" stroke="#58626f" stroke-width="2"/><text x="136" y="339" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="start" font-weight="700">nie</text><rect x="12" y="351" width="416" height="52" rx="6" fill="#ffffff" stroke="#1d2530" stroke-width="2"/><text x="22" y="373" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start" font-weight="700">Nie dokładaj. Podaj klientowi dłuższy termin albo</text><text x="22" y="390" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start" font-weight="700">przenieś zlecenie na inną maszynę.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 324" width="440" height="324" role="img"><rect width="100%" height="100%" fill="#ffffff"/><text x="12" y="18" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#58626f" text-anchor="start">Gdzie kolejki rosną najszybciej</text><rect x="36" y="50" width="194" height="114" rx="6" fill="#f3f4f6" stroke="#dde1e6" stroke-width="1"/><text x="46" y="72" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530" text-anchor="start" font-weight="700">Kolejki z chaosu</text><text x="46" y="93" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Maszyna ma luz, a i tak</text><text x="46" y="109" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">tworzą się zatory.</text><text x="46" y="125" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Wyrównaj napływ i czasy</text><text x="46" y="141" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">obróbki.</text><rect x="234" y="50" width="194" height="114" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><text x="244" y="72" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#c2410c" text-anchor="start" font-weight="700">Strefa kolejek</text><text x="244" y="93" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Każdy punkt obciążenia</text><text x="244" y="109" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">kosztuje godziny. Najpierw</text><text x="244" y="125" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">zmniejsz zmienność.</text><rect x="36" y="168" width="194" height="114" rx="6" fill="#f3f4f6" stroke="#dde1e6" stroke-width="1"/><text x="46" y="190" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530" text-anchor="start" font-weight="700">Zapas mocy</text><text x="46" y="211" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Tu możesz dokładać</text><text x="46" y="227" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">zlecenia bez ryzyka dla</text><text x="46" y="243" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">terminów.</text><rect x="234" y="168" width="194" height="114" rx="6" fill="#f3f4f6" stroke="#dde1e6" stroke-width="1"/><text x="244" y="190" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530" text-anchor="start" font-weight="700">Pełno, ale płynnie</text><text x="244" y="211" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">Wysokie obciążenie działa,</text><text x="244" y="227" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">dopóki zmienność jest</text><text x="244" y="243" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="start">niska. Pilnuj jej.</text><line x1="34" y1="292" x2="430" y2="292" stroke="#58626f" stroke-width="1.5"/><path d="M422,287 L430,292 L422,297" fill="none" stroke="#58626f" stroke-width="1.5"/><text x="34" y="310" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="start">poniżej 80%</text><text x="430" y="310" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="end">powyżej 85%</text><text x="232" y="310" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="middle" font-weight="700">obciążenie</text><line x1="31" y1="284" x2="31" y2="48" stroke="#58626f" stroke-width="1.5"/><path d="M26,56 L31,48 L36,56" fill="none" stroke="#58626f" stroke-width="1.5"/><text x="18" y="166" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1d2530" text-anchor="middle" font-weight="700" transform="rotate(-90 18 166)">zmienność</text><text x="18" y="284" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="start" transform="rotate(-90 18 284)">niska</text><text x="18" y="62" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#58626f" text-anchor="end" transform="rotate(-90 18 62)">wysoka</text></svg>

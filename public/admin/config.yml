# Panel redakcji Rytmu Hali (Sveltia CMS): https://rytmhali.pl/admin/
# Pola odpowiadają schematom treści w src/content.config.ts. Test src/lib/panel.test.ts pilnuje zgodności obu stron
# (nazwy pól, wymagane pola, listy wyboru, relacje) i poprawności tego pliku względem schematu Sveltia CMS.
# Dokumentacja: https://sveltiacms.app/en/docs (wersja przypięta w public/admin/index.html i package.json).

backend:
  name: github
  repo: paprykak/lean-time-study-tracker # po zmianie nazwy repozytorium na rytm-hali: paprykak/rytm-hali
  branch: main
  # Logowanie przez GitHub: worker/index.js (/api/auth). Do czasu ustawienia sekretów działa „Sign In with Token”.
  base_url: https://rytmhali.pl
  auth_endpoint: api/auth
  auth_scope: repo
  commit_messages:
    create: 'Treść: nowy wpis w „{{collection}}”: {{slug}}'
    update: 'Treść: zmiana w „{{collection}}”: {{slug}}'
    delete: 'Treść: usunięcie z „{{collection}}”: {{slug}}'
    uploadMedia: 'Media: wgranie {{path}}'
    deleteMedia: 'Media: usunięcie {{path}}'
    openAuthoring: '{{message}}'

# Przepływ redakcyjny: każdy wpis to gałąź i pull request (szkic → do sprawdzenia → gotowe → publikacja).
# Gałąź buduje się w Cloudflare jako podgląd z noindex; publikacja = scalenie z main (produkcja).
# „Zapisz i opublikuj” (direct_publish) na szybkie poprawki, np. literówki.
publish_mode:
  type: editorial_workflow
  direct_publish: true

site_url: https://rytmhali.pl
app_title: 'Rytm Hali: panel redakcji'
logo:
  src: /favicon.svg

# Zdjęcia trafiają do src/assets (Astro robi z nich AVIF i WebP w kilku rozmiarach). Ścieżka od katalogu projektu.
media_folder: /src/assets/zdjecia
public_folder: /src/assets/zdjecia
media_libraries:
  all:
    max_file_size: 15000000
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 90
        width: 2400
        height: 2400
  # Bez bibliotek zdjęć stockowych w panelu: każde zdjęcie przechodzi przez rejestr licencji (kolekcja „Zdjęcia”).
  stock_assets:
    providers: []

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
  maxlength: 70

output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 2

collections:
  - name: artykuly
    label: Artykuły
    label_singular: artykuł
    description: Teksty magazynu (poradniki, analizy, wywiady, raporty). Adres strony to rytmhali.pl/ i nazwa pliku wpisu.
    icon: article
    folder: src/content/artykuly
    extension: md
    format: frontmatter
    create: true
    identifier_field: tytul
    slug:
      template: '{{tytul}}'
      editable: [create]
    preview_path: '{{slug}}'
    aliases_field: false
    summary: '{{tytul}}'
    sortable_fields:
      fields: [opublikowano, tytul]
      default: { field: opublikowano, direction: descending }
    view_filters:
      filters:
        - { name: szkice, label: Szkice, field: szkic, eq: true }
        - { name: wyroznione, label: Wyróżnione, field: wyrozniony, eq: true }
        - { name: testowe, label: Wpisy testowe, field: testowy, eq: true }
    fields:
      - name: tytul
        label: Tytuł
        widget: string
        minlength: 10
        maxlength: 120
        hint: 'Konkretny i obiecujący korzyść, 10–120 znaków. Z tytułu powstaje adres strony (można go poprawić przy tworzeniu).'
      - name: lead
        label: Lead
        widget: text
        minlength: 60
        maxlength: 320
        hint: 'Dwa, trzy zdania pod tytułem: o czym jest tekst i co czytelnik z niego wyniesie (60–320 znaków).'
      - name: dzial
        label: Dział
        widget: relation
        collection: dzialy
        value_field: '{{slug}}'
        display_fields: [nazwa]
        search_fields: [nazwa]
      - name: format
        label: Format
        widget: select
        options: [Poradnik, Analiza, Wywiad, Raport, Wzór do pobrania, Komentarz]
        default: Poradnik
        hint: Rodzaj tekstu widoczny nad tytułem obok działu.
      - name: tematy
        label: Tematy
        widget: relation
        collection: tematy
        value_field: '{{slug}}'
        display_fields: [nazwa]
        search_fields: [nazwa]
        multiple: true
        required: false
        hint: 'Jeden do trzech tematów. Pierwszy jest główny (podświetlony w pasku tematów).'
      - name: autorzy
        label: Autorzy
        widget: relation
        collection: autorzy
        value_field: '{{slug}}'
        display_fields: [imie]
        search_fields: [imie]
        multiple: true
        min: 1
        default: [patryk-korpyta]
      - name: opublikowano
        label: Data publikacji
        widget: datetime
        type: date
        default: '{{now}}'
        hint: Sama data, bez godziny (magazyn, nie serwis wiadomości).
      - name: zaktualizowano
        label: Data aktualizacji
        widget: datetime
        type: date
        required: false
        hint: Tylko przy istotnej zmianie treści (nowe dane, poprawka merytoryczna). Literówki nie zmieniają daty.
      - name: zdjecie
        label: Zdjęcie główne
        widget: relation
        collection: zdjecia
        value_field: '{{slug}}'
        display_fields: [alt]
        search_fields: [alt, autor, dzial]
        hint: 'Z rejestru zdjęć (kolekcja „Zdjęcia”). Nowe zdjęcie najpierw dodaj tam, z licencją i podpisem „Fot.”.'
      - name: podpisZdjecia
        label: Podpis zdjęcia
        widget: string
        required: false
        hint: 'Zdanie pod zdjęciem w kontekście tego tekstu. Podpis „Fot.” z rejestru dochodzi sam.'
      - name: tytulSeo
        label: Tytuł w Google
        widget: string
        maxlength: 60
        required: false
        hint: 'Gdy tytuł jest dłuższy niż ok. 50 znaków: krótsza wersja do wyników wyszukiwania (do 60 znaków).'
      - name: opisSeo
        label: Opis w Google
        widget: text
        minlength: 70
        maxlength: 160
        required: false
        hint: 'Opis w wynikach wyszukiwania (70–160 znaków). Bez niego używamy początku leadu.'
      - name: partner
        label: Materiał partnera
        widget: object
        required: false
        collapsed: true
        hint: 'Tylko dla treści sponsorowanych. Oznaczenie jest zawsze widoczne, a linki dostają rel="sponsored".'
        fields:
          - name: partner
            label: Partner
            widget: relation
            collection: partnerzy
            value_field: '{{slug}}'
            display_fields: [nazwa]
            search_fields: [nazwa]
          - name: oznaczenie
            label: Oznaczenie
            widget: select
            options: [Materiał partnera, Reklama]
            default: Materiał partnera
          - name: koniecKampanii
            label: Koniec kampanii
            widget: datetime
            type: date
            required: false
      - name: zrodla
        label: Źródła
        label_singular: źródło
        widget: list
        required: false
        summary: '{{fields.opis}}'
        fields:
          - { name: opis, label: Opis, widget: string, hint: 'Np. „Shingo S., A Revolution in Manufacturing, 1985.”' }
          - { name: adres, label: Adres (opcjonalnie), widget: string, type: url, required: false }
      - name: faq
        label: Pytania i odpowiedzi
        label_singular: pytanie
        widget: list
        required: false
        summary: '{{fields.pytanie}}'
        fields:
          - { name: pytanie, label: Pytanie, widget: string, maxlength: 160 }
          - { name: odpowiedz, label: Odpowiedź, widget: text, maxlength: 800 }
      - name: powiazane
        label: Powiązane artykuły
        widget: relation
        collection: artykuly
        value_field: '{{slug}}'
        display_fields: [tytul]
        search_fields: [tytul]
        multiple: true
        max: 3
        required: false
        hint: 'Wskazane ręcznie trafiają do „Czytaj także” na początku; link działa w obie strony.'
      - name: materialy
        label: Materiały do pobrania
        widget: relation
        collection: materialy
        value_field: '{{slug}}'
        display_fields: [tytul]
        search_fields: [tytul]
        multiple: true
        required: false
      - name: wyrozniony
        label: Wyróżniony na stronie głównej
        widget: boolean
        default: false
      - name: noindex
        label: Ukryj przed wyszukiwarkami (noindex)
        widget: boolean
        default: false
      - name: szkic
        label: Szkic (nie publikuj na produkcji)
        widget: boolean
        default: false
        hint: 'Wpis zostaje w repozytorium, ale strona go nie pokazuje (widać go tylko w podglądzie gałęzi).'
      - name: testowy
        label: Wpis testowy (fikcyjny)
        widget: boolean
        default: false
        hint: Wpisy testowe nigdy nie trafiają na produkcję.
      - name: body
        label: Treść
        widget: markdown
        modes: [rich_text, raw]
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: []
        hint: 'Śródtytuły: Nagłówek 2 (z nich powstaje spis treści). Reklama wejdzie sama po 3. akapicie. Zdjęcia w treści dojdą z rejestrem (F3).'

  - name: materialy
    label: Materiały do pobrania
    label_singular: materiał
    description: Wzory, karty i szablony z własną stroną w dziale „Do pobrania” i ramką w artykułach.
    icon: download
    folder: src/content/materialy
    extension: md
    format: frontmatter
    create: true
    identifier_field: tytul
    slug:
      template: '{{tytul}}'
      editable: [create]
    preview_path: 'do-pobrania/{{slug}}'
    aliases_field: false
    fields:
      - { name: tytul, label: Tytuł, widget: string }
      - { name: opis, label: Opis, widget: text, minlength: 40, maxlength: 300, hint: 'Co to jest i do czego służy (40–300 znaków).' }
      - name: plik
        label: Plik
        widget: file
        media_folder: /public/pobierz
        public_folder: /pobierz
        accept: '.pdf,.xlsx,.docx,.zip'
        hint: 'PDF, XLSX, DOCX albo ZIP. Nazwa pliku małymi literami, bez polskich znaków (panel zamienia ją sam).'
      - name: format
        label: Format
        widget: select
        options: [PDF, XLSX, DOCX, ZIP]
      - { name: strony, label: Liczba stron, widget: number, value_type: int, min: 1, required: false }
      - name: podglady
        label: Podglądy stron
        widget: image
        multiple: true
        required: false
        media_folder: /src/assets/materialy
        public_folder: /src/assets/materialy
      - name: dzial
        label: Dział
        widget: relation
        collection: dzialy
        value_field: '{{slug}}'
        display_fields: [nazwa]
        search_fields: [nazwa]
      - name: tematy
        label: Tematy
        widget: relation
        collection: tematy
        value_field: '{{slug}}'
        display_fields: [nazwa]
        search_fields: [nazwa]
        multiple: true
        required: false
      - { name: opublikowano, label: Data publikacji, widget: datetime, type: date, default: '{{now}}' }
      - { name: zaktualizowano, label: Data aktualizacji, widget: datetime, type: date, required: false }
      - { name: szkic, label: Szkic (nie publikuj na produkcji), widget: boolean, default: false }
      - { name: testowy, label: Wpis testowy (fikcyjny), widget: boolean, default: false }
      - name: body
        label: Opis na stronie materiału
        widget: markdown
        modes: [rich_text, raw]
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list]
        editor_components: []
        required: false

  - name: zdjecia
    label: Zdjęcia (rejestr licencji)
    label_singular: zdjęcie
    description: 'Każde zdjęcie w serwisie ma tu wpis: źródło, autor, licencja, podpis „Fot.”. Dozwolone: CC0, CC BY, Unsplash, Pexels, własne, partnera za zgodą. Bez CC BY-SA, marek i logo, zdjęć od pracodawców.'
    icon: photo_library
    folder: src/content/zdjecia
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: alt
    slug:
      template: '{{alt}}'
      editable: [create]
    summary: '{{alt}}'
    fields:
      - name: plik
        label: Plik zdjęcia
        widget: image
        choose_url: false
        hint: 'Najlepiej co najmniej 1600 px szerokości. Panel zapisze WebP do 2400 px i usunie metadane.'
      - { name: alt, label: Opis dla niewidomych (alt), widget: text, minlength: 20, hint: 'Co widać na zdjęciu, konkretnie (co najmniej 20 znaków). Bez „zdjęcie przedstawia”.' }
      - name: fot
        label: Podpis „Fot.”
        widget: string
        pattern: ['^Fot\. ', 'Podpis zaczyna się od „Fot. ”']
        hint: 'Np. „Fot. Jan Kowalski / Wikimedia Commons, CC BY 4.0 (kadr)”. Przy CC BY dopisz „(kadr)”, gdy zdjęcie jest przycięte.'
      - { name: autor, label: Autor, widget: string }
      - name: licencja
        label: Licencja
        widget: select
        options: [CC0 1.0, CC BY 2.0, CC BY 3.0, CC BY 4.0, Unsplash, Pexels, Własne redakcji, Partner (zgoda)]
      - { name: licencjaUrl, label: Adres tekstu licencji, widget: string, type: url, required: false }
      - { name: zrodlo, label: Strona zdjęcia u źródła, widget: string, type: url, required: false, hint: 'Wymagana dla zdjęć spoza redakcji (link w podpisie).' }
      - { name: pobierz, label: Adres pliku do pobrania (npm run zdjecia), widget: string, type: url, required: false, hint: 'Zostaw puste przy zdjęciu wgranym w panelu.' }
      - name: dzial
        label: Dział
        widget: relation
        collection: dzialy
        value_field: '{{slug}}'
        display_fields: [nazwa]
        search_fields: [nazwa]
        required: false
      - name: kadr
        label: Kadr przy pobieraniu (ułamki 0–1)
        widget: object
        required: false
        collapsed: true
        hint: Tylko dla zdjęć pobieranych skryptem npm run zdjecia.
        fields:
          - { name: lewo, label: Od lewej, widget: number, value_type: float, min: 0, max: 1 }
          - { name: gora, label: Od góry, widget: number, value_type: float, min: 0, max: 1 }
          - { name: szerokosc, label: Szerokość, widget: number, value_type: float, min: 0, max: 1 }
          - { name: wysokosc, label: Wysokość, widget: number, value_type: float, min: 0, max: 1 }
      - name: pozycja
        label: Punkt kadrowania
        widget: select
        options:
          - { label: Środek, value: center }
          - { label: Lewa strona, value: left }
          - { label: Prawa strona, value: right }
          - { label: Góra, value: top }
          - { label: Dół, value: bottom }
        required: false
        hint: Która część zdjęcia zostaje przy kadrowaniu do 16:9 i 1:1.
      - { name: uwagi, label: Uwagi redakcji, widget: text, required: false }
      - { name: zgoda, label: Zgoda na użycie (data i forma), widget: string, minlength: 10, hint: 'Np. „2026-11-06: zgoda Patryka mailem”.' }

  - name: autorzy
    label: Autorzy
    label_singular: autor
    description: Strony autorów i ramki pod artykułami (doświadczenie i kompetencje, dane Person w Google).
    icon: badge
    folder: src/content/autorzy
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: imie
    slug:
      template: '{{imie}}'
      editable: [create]
    preview_path: 'autor/{{slug}}'
    fields:
      - { name: imie, label: Imię i nazwisko, widget: string }
      - name: typ
        label: Rodzaj
        widget: select
        options: [Osoba, Redakcja]
        default: Osoba
        hint: '„Redakcja” to podpis zespołu (w danych dla Google: organizacja Rytm Hali).'
      - { name: rola, label: Rola, widget: string, hint: 'Np. „Redaktor naczelny”, „Autor, inżynier procesu”.' }
      - { name: bio, label: Bio, widget: text, minlength: 40, hint: 'Doświadczenie w operacjach, w trzeciej osobie, 2–4 zdania.' }
      - { name: kompetencje, label: Kompetencje, label_singular: kompetencja, widget: list, required: false }
      - name: zdjecie
        label: Zdjęcie (kwadratowe)
        widget: image
        required: false
        choose_url: false
        media_folder: /src/assets/autorzy
        public_folder: /src/assets/autorzy
      - { name: sameAs, label: Profile (LinkedIn i inne), label_singular: profil, widget: list, required: false, field: { name: adres, label: Adres, widget: string, type: url } }
      - { name: email, label: E-mail, widget: string, type: email, required: false }

  - name: dzialy
    label: Działy
    label_singular: dział
    description: Działy w menu. Kolejność w menu według pola „Kolejność”.
    icon: folder
    folder: src/content/dzialy
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: nazwa
    slug:
      template: '{{nazwa}}'
      editable: [create]
    preview_path: 'dzial/{{slug}}'
    sortable_fields:
      fields: [kolejnosc, nazwa]
      default: { field: kolejnosc, direction: ascending }
    fields:
      - { name: nazwa, label: Nazwa, widget: string }
      - { name: nazwaMenu, label: Nazwa w menu, widget: string, hint: 'Krótsza wersja, jeśli pełna się nie mieści.' }
      - { name: opis, label: Opis, widget: text, minlength: 40 }
      - { name: kolejnosc, label: Kolejność w menu, widget: number, value_type: int, hint: 'Co 10 (10, 20, 30…), żeby łatwo wstawić nowy dział.' }
      - { name: tytulSeo, label: Tytuł w Google, widget: string, maxlength: 60, required: false }
      - { name: opisSeo, label: Opis w Google, widget: text, maxlength: 160, required: false }

  - name: tematy
    label: Tematy
    label_singular: temat
    description: Zagadnienia przekrojowe (SMED, OEE…). Strona tematu zbiera artykuły z wielu działów.
    icon: sell
    folder: src/content/tematy
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: nazwa
    slug:
      template: '{{nazwa}}'
      editable: [create]
    preview_path: 'temat/{{slug}}'
    fields:
      - { name: nazwa, label: Nazwa, widget: string }
      - { name: opis, label: Opis, widget: text, required: false }
      - name: dzial
        label: Dział główny
        widget: relation
        collection: dzialy
        value_field: '{{slug}}'
        display_fields: [nazwa]
        search_fields: [nazwa]
        required: false

  - name: partnerzy
    label: Partnerzy
    label_singular: partner
    description: Firmy, z którymi współpracujemy przy materiałach partnera i kampaniach.
    icon: handshake
    folder: src/content/partnerzy
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: nazwa
    slug:
      template: '{{nazwa}}'
      editable: [create]
    fields:
      - { name: nazwa, label: Nazwa, widget: string }
      - { name: adres, label: Strona www, widget: string, type: url }
      - { name: opis, label: Opis, widget: text, required: false }
      - name: logo
        label: Logo
        widget: image
        required: false
        choose_url: false
        media_folder: /src/assets/partnerzy
        public_folder: /src/assets/partnerzy

  - name: kampanie
    label: Kampanie reklamowe
    label_singular: kampania
    description: 'Reklamy sprzedawane bezpośrednio: miejsca, kreacje w wymiarach slotów, daty i link z UTM. Bez kampanii slot pokazuje autopromocję newslettera.'
    icon: campaign
    folder: src/content/kampanie
    extension: json
    format: json
    create: true
    identifier_field: nazwa
    slug:
      template: '{{nazwa}}'
      editable: [create]
    fields:
      - { name: nazwa, label: Nazwa kampanii, widget: string }
      - name: partner
        label: Partner
        widget: relation
        collection: partnerzy
        value_field: '{{slug}}'
        display_fields: [nazwa]
        search_fields: [nazwa]
      - { name: link, label: Link docelowy, widget: string, type: url, hint: 'Parametry UTM dopisze serwis (utm_source=rytmhali).' }
      - { name: od, label: Od (włącznie), widget: datetime, type: date }
      - { name: do, label: Do (włącznie), widget: datetime, type: date }
      - name: miejsca
        label: Miejsca
        widget: select
        multiple: true
        min: 1
        options:
          - { label: 'Strona główna, góra (billboard / mobilny)', value: glowna-gora }
          - { label: 'Strona główna, kolumna boczna (prostokąt)', value: glowna-bok }
          - { label: 'Artykuł, w treści po 3. akapicie (baner, tylko komputer)', value: artykul-tresc }
          - { label: 'Artykuł, kolumna boczna (półstrona)', value: artykul-bok }
          - { label: 'Dział, góra (billboard / mobilny)', value: dzial-gora }
      - name: kreacje
        label: Kreacje
        widget: object
        hint: 'Co najmniej jedna kreacja. Obraz w dokładnym wymiarze formatu albo 2× większy (ostry na telefonach).'
        fields:
          - { name: billboard, label: Billboard 970 × 250, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: baner, label: Baner 750 × 200, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: prostokat, label: Prostokąt 300 × 250, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: polstrona, label: Półstrona 300 × 600, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: mobilny, label: Mobilny 320 × 100, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: mobilnyProstokat, label: Mobilny prostokąt 300 × 250, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
      - { name: altKreacji, label: Tekst alternatywny kreacji, widget: string, minlength: 10, hint: 'Co mówi reklama, np. nazwa produktu i hasło.' }
      - { name: aktywna, label: Aktywna, widget: boolean, default: true }

  - divider: true

  - name: ustawienia
    label: Ustawienia serwisu
    icon: settings
    files:
      - name: serwis
        label: Menu, stopka i teksty stałe
        file: src/data/ustawienia.json
        format: json
        fields:
          - { name: nazwa, label: Nazwa serwisu, widget: string, readonly: true }
          - { name: opis, label: Opis serwisu, widget: text, hint: 'Opis w Google dla strony głównej i w danych organizacji.' }
          - { name: haslo, label: Hasło w pasku górnym, widget: string }
          - { name: adres, label: Adres serwisu, widget: string, readonly: true }
          - { name: emailRedakcji, label: E-mail redakcji, widget: string, type: email }
          - { name: redaktorNaczelny, label: Redaktor naczelny, widget: string }
          - name: menuDodatkowe
            label: Menu po działach
            label_singular: pozycja
            widget: list
            fields: &linki
              - { name: nazwa, label: Nazwa, widget: string }
              - { name: adres, label: Adres, widget: string, hint: 'Adres w serwisie, np. /do-pobrania' }
          - name: tematyWyroznione
            label: Pasek tematów
            widget: relation
            collection: tematy
            value_field: '{{slug}}'
            display_fields: [nazwa]
            search_fields: [nazwa]
            multiple: true
            min: 3
            hint: Tematy w pasku pod menu, w tej kolejności.
          - { name: pasekGorny, label: Pasek górny (komputer), label_singular: link, widget: list, fields: *linki }
          - name: stopka
            label: Stopka
            widget: object
            fields:
              - { name: serwis, label: Kolumna „Serwis”, label_singular: link, widget: list, fields: *linki }
              - { name: wspolpraca, label: Kolumna „Współpraca”, label_singular: link, widget: list, fields: *linki }
              - { name: prawne, label: Kolumna „Informacje prawne”, label_singular: link, widget: list, fields: *linki }
          - name: newsletter
            label: Newsletter
            widget: object
            hint: Treść zgody zatwierdza Patryk (RODO, F7).
            fields:
              - { name: nazwa, label: Nazwa newslettera, widget: string }
              - { name: opis, label: Opis, widget: text }
              - { name: zgoda, label: Treść zgody przy zapisie, widget: text }
              - { name: potwierdzenie, label: Komunikat po zapisie, widget: text }

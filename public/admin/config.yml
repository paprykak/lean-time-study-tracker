# Panel redakcji Rytmu Hali (Sveltia CMS): https://rytmhali.pl/admin/
# Pola odpowiadają schematom treści w src/content.config.ts. Test src/lib/panel.test.ts pilnuje zgodności obu stron
# (nazwy pól, wymagane pola, listy wyboru, relacje) i poprawności tego pliku względem schematu Sveltia CMS.
# Dokumentacja: https://sveltiacms.app/en/docs (wersja przypięta w public/admin/index.html i package.json).

backend:
  name: github
  repo: paprykak/lean-time-study-tracker # po zmianie nazwy repozytorium na rytm-hali: paprykak/rytm-hali
  branch: main
  # Logowanie przez GitHub: worker/index.js (/api/auth). Do czasu ustawienia sekretów działa „Sign In with Token”.
  base_url: https://rytmhali.pl
  auth_endpoint: api/auth
  auth_scope: repo
  commit_messages:
    create: 'Treść: nowy wpis w „{{collection}}”: {{slug}}'
    update: 'Treść: zmiana w „{{collection}}”: {{slug}}'
    delete: 'Treść: usunięcie z „{{collection}}”: {{slug}}'
    uploadMedia: 'Media: wgranie {{path}}'
    deleteMedia: 'Media: usunięcie {{path}}'
    openAuthoring: '{{message}}'

# Przepływ redakcyjny: każdy wpis to gałąź i pull request (szkic → do sprawdzenia → gotowe → publikacja).
# Gałąź buduje się w Cloudflare jako podgląd z noindex; publikacja = scalenie z main (produkcja).
# „Zapisz i opublikuj” (direct_publish) na szybkie poprawki, np. literówki.
publish_mode:
  type: editorial_workflow
  direct_publish: true

site_url: https://rytmhali.pl
app_title: 'Rytm Hali: panel redakcji'
logo:
  src: /favicon.svg

# Obrazy (logo partnerów, kreacje kampanii) trafiają do src/assets (Astro robi z nich AVIF i WebP). Ścieżka od katalogu
# projektu; pola obrazów mają własne katalogi.
media_folder: /src/assets/kampanie
public_folder: /src/assets/kampanie
media_libraries:
  all:
    max_file_size: 15000000
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 90
        width: 2400
        height: 2400
  # Bez bibliotek zdjęć stockowych w panelu: serwis narzędzi nie używa zdjęć (rejestr licencji w archiwum/).
  stock_assets:
    providers: []

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
  maxlength: 70

output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 2

collections:
  - name: partnerzy
    label: Partnerzy
    label_singular: partner
    description: Firmy, z którymi współpracujemy przy kampaniach reklamowych.
    icon: handshake
    folder: src/content/partnerzy
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: nazwa
    slug:
      template: '{{nazwa}}'
      editable: [create]
    fields:
      - { name: nazwa, label: Nazwa, widget: string }
      - { name: adres, label: Strona www, widget: string, type: url }
      - { name: opis, label: Opis, widget: text, required: false }
      - name: logo
        label: Logo
        widget: image
        required: false
        choose_url: false
        media_folder: /src/assets/partnerzy
        public_folder: /src/assets/partnerzy

  - name: kampanie
    label: Kampanie reklamowe
    label_singular: kampania
    description: 'Reklamy sprzedawane bezpośrednio: miejsca, kreacje w wymiarach slotów, daty i link z UTM. Bez kampanii slot pokazuje autopromocję newslettera.'
    icon: campaign
    folder: src/content/kampanie
    extension: json
    format: json
    create: true
    identifier_field: nazwa
    slug:
      template: '{{nazwa}}'
      editable: [create]
    fields:
      - { name: nazwa, label: Nazwa kampanii, widget: string }
      - name: partner
        label: Partner
        widget: relation
        collection: partnerzy
        value_field: '{{slug}}'
        display_fields: [nazwa]
        search_fields: [nazwa]
      - { name: link, label: Link docelowy, widget: string, type: url, hint: 'Parametry UTM dopisze serwis (utm_source=rytmhali).' }
      - { name: od, label: Od (włącznie), widget: datetime, type: date }
      - { name: do, label: Do (włącznie), widget: datetime, type: date }
      - name: miejsca
        label: Miejsca
        widget: select
        multiple: true
        min: 1
        options:
          - { label: 'Strona główna, pod narzędziami (billboard / mobilny prostokąt)', value: glowna }
      - name: kreacje
        label: Kreacje
        widget: object
        hint: 'Co najmniej jedna kreacja. Obraz w dokładnym wymiarze formatu albo 2× większy (ostry na telefonach).'
        fields:
          - { name: billboard, label: Billboard 970 × 250, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: baner, label: Baner 750 × 200, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: prostokat, label: Prostokąt 300 × 250, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: polstrona, label: Półstrona 300 × 600, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: mobilny, label: Mobilny 320 × 100, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
          - { name: mobilnyProstokat, label: Mobilny prostokąt 300 × 250, widget: image, required: false, choose_url: false, media_folder: /src/assets/kampanie, public_folder: /src/assets/kampanie }
      - { name: altKreacji, label: Tekst alternatywny kreacji, widget: string, minlength: 10, hint: 'Co mówi reklama, np. nazwa produktu i hasło.' }
      - { name: aktywna, label: Aktywna, widget: boolean, default: true }

  - name: strony
    label: Strony stałe
    label_singular: strona
    description: 'O nas, zasady redakcyjne, korekty, oznaczanie reklam, jak używamy AI, kontakt, polityka prywatności, reklama, newsletter. Adresy są stałe; nowych stron nie dodajemy w panelu.'
    icon: description
    folder: src/content/strony
    extension: md
    format: frontmatter
    create: false
    delete: false
    identifier_field: tytul
    preview_path: '{{slug}}'
    aliases_field: false
    fields:
      - { name: tytul, label: Tytuł, widget: string, minlength: 3, maxlength: 80 }
      - { name: opis, label: Opis w Google, widget: text, minlength: 70, maxlength: 160 }
      - { name: zaktualizowano, label: Data aktualizacji, widget: datetime, type: date, default: '{{now}}' }
      - name: projekt
        label: Projekt (jeszcze nie zatwierdzony)
        widget: boolean
        default: false
        hint: 'Odznacz, gdy redaktor naczelny zatwierdzi tekst. Projekt ma na stronie widoczne oznaczenie i nie może trafić na produkcję po starcie.'
      - name: body
        label: Treść
        widget: markdown
        modes: [rich_text, raw]
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: []

  - divider: true

  - name: ustawienia
    label: Ustawienia serwisu
    icon: settings
    files:
      - name: serwis
        label: Menu, stopka i teksty stałe
        file: src/data/ustawienia.json
        format: json
        fields:
          - { name: nazwa, label: Nazwa serwisu, widget: string, readonly: true }
          - { name: opis, label: Opis serwisu, widget: text, hint: 'Opis w Google dla strony głównej i w danych organizacji.' }
          - { name: haslo, label: Hasło w pasku górnym, widget: string }
          - { name: adres, label: Adres serwisu, widget: string, readonly: true }
          - { name: emailRedakcji, label: E-mail redakcji, widget: string, type: email }
          - { name: redaktorNaczelny, label: Redaktor naczelny, widget: string }
          - name: pasekGorny
            label: Pasek górny (komputer)
            label_singular: link
            widget: list
            fields: &linki
              - { name: nazwa, label: Nazwa, widget: string }
              - { name: adres, label: Adres, widget: string, hint: 'Adres w serwisie, np. /narzedzia' }
          - name: stopka
            label: Stopka
            widget: object
            fields:
              - { name: serwis, label: Kolumna „Serwis”, label_singular: link, widget: list, fields: *linki }
              - { name: wspolpraca, label: Kolumna „Współpraca”, label_singular: link, widget: list, fields: *linki }
              - { name: prawne, label: Kolumna „Informacje prawne”, label_singular: link, widget: list, fields: *linki }
          - name: newsletter
            label: Newsletter
            widget: object
            hint: Treść zgody zatwierdza Patryk (RODO, F7).
            fields:
              - { name: nazwa, label: Nazwa newslettera, widget: string }
              - { name: opis, label: Opis, widget: text }
              - { name: zgoda, label: Treść zgody przy zapisie, widget: text }
              - { name: potwierdzenie, label: Komunikat po zapisie, widget: text }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 410" width="440" height="410" role="img"><rect width="100%" height="100%" fill="#ffffff"/><text x="12" y="18" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#58626f">Karta kontrolna na jednym wymiarze w pięciu krokach</text><rect x="12" y="30" width="382" height="56" rx="6" fill="#f3f4f6" stroke="#1d2530" stroke-width="1"/><circle cx="34" cy="58" r="13" fill="#1d2530"/><text x="34" y="63" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="58" y="54" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Wybierz jeden wymiar, który najczęściej daje</text><text x="58" y="73" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">braki albo korekty</text><line x1="203" y1="88" x2="203" y2="102" stroke="#58626f" stroke-width="2"/><path d="M198,99 L203,106 L208,99" fill="none" stroke="#58626f" stroke-width="2"/><rect x="12" y="108" width="382" height="56" rx="6" fill="#f3f4f6" stroke="#1d2530" stroke-width="1"/><circle cx="34" cy="136" r="13" fill="#1d2530"/><text x="34" y="141" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="58" y="132" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Zbierz 20–25 pomiarów bez korygowania</text><text x="58" y="151" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">maszyny</text><line x1="203" y1="166" x2="203" y2="180" stroke="#58626f" stroke-width="2"/><path d="M198,177 L203,184 L208,177" fill="none" stroke="#58626f" stroke-width="2"/><rect x="12" y="186" width="382" height="56" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><circle cx="34" cy="214" r="13" fill="#c2410c"/><text x="34" y="219" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="58" y="210" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Policz średnią, ruchomy rozstęp i granice:</text><text x="58" y="229" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">średnia ± 2,66 × MR̄</text><line x1="203" y1="244" x2="203" y2="258" stroke="#58626f" stroke-width="2"/><path d="M198,255 L203,262 L208,255" fill="none" stroke="#58626f" stroke-width="2"/><rect x="12" y="264" width="382" height="56" rx="6" fill="#f3f4f6" stroke="#1d2530" stroke-width="1"/><circle cx="34" cy="292" r="13" fill="#1d2530"/><text x="34" y="297" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="58" y="288" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Wywieś kartę przy maszynie z regułami</text><text x="58" y="307" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">reakcji</text><line x1="203" y1="322" x2="203" y2="336" stroke="#58626f" stroke-width="2"/><path d="M198,333 L203,340 L208,333" fill="none" stroke="#58626f" stroke-width="2"/><rect x="12" y="342" width="382" height="56" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><circle cx="34" cy="370" r="13" fill="#c2410c"/><text x="34" y="375" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="58" y="366" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Zapisuj przyczynę każdego sygnału; co</text><text x="58" y="385" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">miesiąc usuń najczęstszą</text><path d="M394,386 L426,386 L426,42 L398,42" fill="none" stroke="#c2410c" stroke-width="2"/><path d="M404,37 L397,42 L404,47" fill="none" stroke="#c2410c" stroke-width="2"/><text x="420" y="214" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" transform="rotate(-90 420 214)">mniejszy rozrzut, nowe granice</text></svg>

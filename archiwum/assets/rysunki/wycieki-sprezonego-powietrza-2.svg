<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 469" width="440" height="469" role="img"><rect width="100%" height="100%" fill="#ffffff"/><text x="12" y="18" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#58626f">Test wycieków w sobotę, krok po kroku</text><rect x="12" y="30" width="416" height="56" rx="6" fill="#f3f4f6" stroke="#1d2530" stroke-width="1"/><circle cx="34" cy="58" r="13" fill="#1d2530"/><text x="34" y="63" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="58" y="54" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Wyłącz wszystkie odbiory powietrza: maszyny,</text><text x="58" y="73" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">narzędzia, stanowiska</text><line x1="220" y1="88" x2="220" y2="102" stroke="#58626f" stroke-width="2"/><path d="M215,99 L220,106 L225,99" fill="none" stroke="#58626f" stroke-width="2"/><rect x="12" y="108" width="416" height="56" rx="6" fill="#f3f4f6" stroke="#1d2530" stroke-width="1"/><circle cx="34" cy="136" r="13" fill="#1d2530"/><text x="34" y="141" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="58" y="132" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Zostaw włączoną jedną sprężarkę, jeśli sama</text><text x="58" y="151" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">utrzyma ciśnienie</text><line x1="220" y1="166" x2="220" y2="180" stroke="#58626f" stroke-width="2"/><path d="M215,177 L220,184 L225,177" fill="none" stroke="#58626f" stroke-width="2"/><rect x="12" y="186" width="416" height="56" rx="6" fill="#f3f4f6" stroke="#1d2530" stroke-width="1"/><circle cx="34" cy="214" r="13" fill="#1d2530"/><text x="34" y="219" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="58" y="210" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Zmierz kilka cykli: T = minuty pod</text><text x="58" y="229" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">obciążeniem, t = minuty odpoczynku</text><line x1="220" y1="244" x2="220" y2="258" stroke="#58626f" stroke-width="2"/><path d="M215,255 L220,262 L225,255" fill="none" stroke="#58626f" stroke-width="2"/><rect x="12" y="264" width="416" height="37" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><circle cx="34" cy="282.5" r="13" fill="#c2410c"/><text x="34" y="287.5" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="58" y="288" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Udział wycieków (%) = T × 100 / (T + t)</text><line x1="220" y1="303" x2="220" y2="317" stroke="#58626f" stroke-width="2"/><path d="M215,314 L220,321 L225,314" fill="none" stroke="#58626f" stroke-width="2"/><rect x="12" y="323" width="416" height="56" rx="6" fill="#fff4ed" stroke="#c2410c" stroke-width="2"/><circle cx="34" cy="351" r="13" fill="#c2410c"/><text x="34" y="356" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="58" y="347" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Koszt roczny = udział × moc tej sprężarki</text><text x="58" y="366" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">(kW) × godziny pod ciśnieniem × cena kWh</text><line x1="220" y1="381" x2="220" y2="395" stroke="#58626f" stroke-width="2"/><path d="M215,392 L220,399 L225,392" fill="none" stroke="#58626f" stroke-width="2"/><rect x="12" y="401" width="416" height="56" rx="6" fill="#f3f4f6" stroke="#1d2530" stroke-width="1"/><circle cx="34" cy="429" r="13" fill="#1d2530"/><text x="34" y="434" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="58" y="425" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">Zapisz wynik w karcie i powtórz test po</text><text x="58" y="444" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#1d2530">naprawach</text></svg>
